<title>Kape ng Bayan Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: persistent left navigation + one working pane. Login is a single centered card. Warm coffee-brown accent taken from the Kape ng Bayan logo. */
:root{
  --bg:#f4f0ea; --surface:#ffffff; --surface-2:#faf7f2; --line:#e2dbd0;
  --fg:#241a12; --muted:#6b5d50;
  --accent:#7a4017; --accent-strong:#5a2e10; --accent-soft:#f5e9dc; --on-accent:#ffffff;
  --good:#17703f; --good-soft:#dff3e7;
  --warn:#8a5a00; --warn-soft:#fbeed0;
  --bad:#b3261e; --bad-soft:#fbe3e1;
  --info:#1f5fd6; --info-soft:#e3ecfc;
  --neutral:#56637c; --neutral-soft:#e8ecf3;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14100c; --surface:#1d1712; --surface-2:#251d16; --line:#3a2f25;
    --fg:#f1e9df; --muted:#b3a393;
    --accent:#e0a96d; --accent-strong:#f0c590; --accent-soft:#3a2a1a; --on-accent:#1d1208;
    --good:#5fd08e; --good-soft:#143524;
    --warn:#f0c15a; --warn-soft:#3a2d0e;
    --bad:#ff8f86; --bad-soft:#3d1a18;
    --info:#6c9cff; --info-soft:#1d2d52;
    --neutral:#98a5c0; --neutral-soft:#222d45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14100c; --surface:#1d1712; --surface-2:#251d16; --line:#3a2f25;
  --fg:#f1e9df; --muted:#b3a393;
  --accent:#e0a96d; --accent-strong:#f0c590; --accent-soft:#3a2a1a; --on-accent:#1d1208;
  --good:#5fd08e; --good-soft:#143524;
  --warn:#f0c15a; --warn-soft:#3a2d0e;
  --bad:#ff8f86; --bad-soft:#3d1a18;
  --info:#6c9cff; --info-soft:#1d2d52;
  --neutral:#98a5c0; --neutral-soft:#222d45;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px;
}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);font-size:13px}
.fine{color:var(--muted);font-size:12px;line-height:1.45}
.strong{font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--font-mono);font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--accent-strong);padding:6px 10px}
.btn-quiet:hover{background:var(--accent-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--neutral-soft);color:var(--neutral)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,legend{font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-height:40px
}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--font-mono);font-size:12.5px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.err{color:var(--bad);background:var(--bad-soft);border-radius:6px;padding:9px 12px;font-size:14px}
.err[hidden]{display:none}
.notice{color:var(--good);background:var(--good-soft);border-radius:6px;padding:9px 12px;font-size:14px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn-danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn-danger:hover{background:var(--bad-soft)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn-danger-solid:hover{background:var(--bad);filter:brightness(.92)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.panel.warn{border-color:var(--bad)}
.head-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pw{position:relative}
.pw input{padding-right:72px}
.pwtoggle{position:absolute;right:3px;top:50%;transform:translateY(-50%)}
.caps{color:var(--warn);font-weight:500}
input[aria-invalid=true]{border-color:var(--bad)}
.demo{font-size:12px;color:var(--muted)}
.demo summary{cursor:pointer;width:max-content}
.demo p{margin-top:6px}

/* shell */
.app{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px}
.bname{font-family:var(--font-display);font-weight:700;font-size:17px}
.logo{display:block;height:auto;flex:none}
.side .logo{width:84px;margin:2px auto 0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:drop-shadow(0 0 1.5px #fcf0d8) drop-shadow(0 0 8px rgba(252,240,216,.22))}}
:root[data-theme="dark"] .logo{filter:drop-shadow(0 0 1.5px #fcf0d8) drop-shadow(0 0 8px rgba(252,240,216,.22))}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--fg)}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current=page]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.side-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.who{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-direction:column;gap:6px}
.head p{color:var(--muted);max-width:62ch}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.edit{border-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.num{text-align:right}
td.actions{text-align:right;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar .field{flex:1 1 180px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent-strong);border-bottom-color:var(--accent);font-weight:600}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stats div{padding:14px 18px;border-right:1px solid var(--line);min-width:0}
.stats div:last-child{border-right:0}
.stats dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stats dd{margin:4px 0 0;font-family:var(--font-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.module{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.module p{color:var(--muted);font-size:14px;flex:1}
.attn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.attn li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.attn li:last-child{border-bottom:0}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline time{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0}
.facts dt{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}

/* reports */
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--muted);counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--neutral-soft);color:var(--neutral);font-size:12px;font-weight:600}
.steps li.done{color:var(--fg)}
.steps li.done::before{background:var(--good-soft);color:var(--good)}
.steps li.now{color:var(--accent-strong);border-color:var(--accent);background:var(--accent-soft)}
.steps li.now::before{background:var(--accent);color:var(--on-accent)}
fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.choice input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice span{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice small{color:var(--muted);font-size:12.5px}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rstat{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0}
.rstat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rstat span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(84px,28%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{overflow-wrap:anywhere}
.hbar .track{height:14px;background:var(--neutral-soft);border-radius:3px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbar .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:right}
.paper{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.paper h3{font-family:var(--font-display)}
.paper table{font-size:13px;color:#1a1a1a}
.paper th{background:#f0f0f0;color:#444;border-bottom:1px solid #ccc}
.paper td{border-bottom:1px solid #e3e3e3}
.paper .sub{color:#555}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* login */
.login{max-width:400px;margin:6vh auto 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.login-form{padding:32px 32px 28px;display:flex;flex-direction:column;gap:18px}
.login-form .logo{width:190px;max-width:70%;margin:0 auto}
.login-form .head-center{text-align:center}
.login-form form{display:flex;flex-direction:column;gap:14px}

#toasts{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:20}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;max-width:min(92vw,460px);box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;gap:12px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
  .side-foot{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .side-foot .fine{flex-basis:100%}
  .login-form{padding:26px 22px}
  .timeline li{grid-template-columns:minmax(0,1fr);gap:2px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}
</style>

<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

var LK = {fails:0, until:0, busy:false, timer:null};
var MAX_TRIES = 5, LOCK_SECS = 30;
function lockLeft(){ return Math.max(0, Math.ceil((LK.until-Date.now())/1000)); }
function showLoginErr(msg,lock){
  var err = $('#loginErr'); if(!err) return;
  err.textContent = msg; err.hidden = false;
  if(lock) err.setAttribute('data-lock','1'); else err.removeAttribute('data-lock');
}
function clearLoginErr(){
  var err = $('#loginErr');
  if(err && !err.hasAttribute('data-lock')) err.hidden = true;
  ['user','pass'].forEach(function(id){ var el = $('#'+id); if(el) el.removeAttribute('aria-invalid'); });
}
function paintLock(){
  var btn = $('#loginBtn');
  if(!btn){ clearInterval(LK.timer); LK.timer = null; return; }
  var left = lockLeft();
  if(left>0){ btn.disabled = true; btn.textContent = 'Try again in '+left+'s'; return; }
  clearInterval(LK.timer); LK.timer = null; LK.fails = 0;
  btn.disabled = false; btn.textContent = 'Sign in';
  var err = $('#loginErr');
  if(err && err.hasAttribute('data-lock')){ err.hidden = true; err.removeAttribute('data-lock'); }
}

function doLogin(form){
  if(LK.busy || lockLeft()>0) return;
  var u = form.user.value.trim(), p = form.pass.value, btn = $('#loginBtn');
  clearLoginErr();
  if(!u || !p){
    showLoginErr('Enter your username and password.');
    var bad = u ? form.pass : form.user; bad.setAttribute('aria-invalid','true'); bad.focus(); return;
  }
  LK.busy = true; btn.disabled = true; btn.textContent = 'Signing in…';
  setTimeout(function(){
    LK.busy = false;
    if(u.toLowerCase() === 'admin' && p === 'admin123'){
      LK.fails = 0; S.authed = true; S.notice = '';
      S.view = hashView() || 'dashboard';
      render(); window.scrollTo(0,0); return;
    }
    LK.fails++;
    form.pass.value = '';
    form.user.setAttribute('aria-invalid','true'); form.pass.setAttribute('aria-invalid','true');
    if(LK.fails >= MAX_TRIES){
      LK.until = Date.now()+LOCK_SECS*1000;
      showLoginErr('Too many failed attempts. Sign-in is paused for '+LOCK_SECS+' seconds.',true);
      paintLock(); LK.timer = setInterval(paintLock,1000);
      return;
    }
    var left = MAX_TRIES-LK.fails;
    showLoginErr('Incorrect username or password. '+left+(left===1?' attempt':' attempts')+' left before sign-in pauses.');
    btn.disabled = false; btn.textContent = 'Sign in'; form.pass.focus();
  },450);
}

  S.notice = 'You have been signed out and your session was cleared.';
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  render(); window.scrollTo(0,0);
}

/* ---------- reports ---------- */
var RANGES = [['Daily','Last 7 days, one row per day'],['Weekly','Last 4 weeks, one row per week'],['Monthly','Last 6 months, one row per month']];
var TYPES = [['Sales Revenue','Orders and revenue per period'],['Product Performance','Units sold and revenue per menu item'],['Customer Volume','Customers served and new customers per period']];

function rng(seed){ var s=0,i; for(i=0;i<seed.length;i++) s=(s*31+seed.charCodeAt(i))>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function periodLabels(range){
  var now = new Date(), out = [], i, d, a, b;
  var f = function(x){ return x.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
  if(range==='Daily'){ for(i=6;i>=0;i--){ d=new Date(now); d.setDate(d.getDate()-i); out.push(d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})); } }
  else if(range==='Weekly'){ for(i=3;i>=0;i--){ a=new Date(now); a.setDate(a.getDate()-i*7-6); b=new Date(now); b.setDate(b.getDate()-i*7); out.push(f(a)+' – '+f(b)); } }
  else { for(i=5;i>=0;i--){ d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push(d.toLocaleDateString('en-US',{month:'short',year:'numeric'})); } }
  return out;
}
function sum(rows,k){ return rows.reduce(function(a,r){return a+r[k];},0); }
function peak(rows,k){ return rows.reduce(function(a,r){return r[k]>a[k]?r:a;},rows[0]); }

function buildReport(range,type){
  var r = rng(range+type), k = {Daily:1,Weekly:7,Monthly:30}[range], labels = periodLabels(range), rows, cols, chart, stats, pk;
  if(type==='Sales Revenue'){
    rows = labels.map(function(l){ var o=Math.round((38+r()*22)*k), t=165+r()*55; return {period:l,orders:o,revenue:Math.round(o*t)}; });
    cols = [{k:'period',label:'Period'},{k:'orders',label:'Orders',num:1,fmt:intf},{k:'revenue',label:'Revenue',num:1,fmt:peso}];
    chart = {key:'revenue',label:'period',fmt:peso};
    pk = peak(rows,'revenue');
    stats = [['Total revenue',peso(sum(rows,'revenue'))],['Total orders',intf(sum(rows,'orders'))],['Best period',pk.period]];
  } else if(type==='Product Performance'){
    rows = S.menu.map(function(m){ var u=Math.round((20+r()*60)*k); return {item:m.name,units:u,revenue:u*m.price}; }).sort(function(a,b){return b.units-a.units;});
    cols = [{k:'item',label:'Menu item'},{k:'units',label:'Units sold',num:1,fmt:intf},{k:'revenue',label:'Revenue',num:1,fmt:peso}];
    chart = {key:'units',label:'item',fmt:intf};
    stats = [['Units sold',intf(sum(rows,'units'))],['Revenue',peso(sum(rows,'revenue'))],['Top seller',rows[0].item]];
  } else {
    rows = labels.map(function(l){ var c=Math.round((30+r()*25)*k*0.8); return {period:l,customers:c,fresh:Math.round(c*(0.12+r()*0.15))}; });
    cols = [{k:'period',label:'Period'},{k:'customers',label:'Customers',num:1,fmt:intf},{k:'fresh',label:'New customers',num:1,fmt:intf}];
    chart = {key:'customers',label:'period',fmt:intf};
    pk = peak(rows,'customers');
    stats = [['Customers served',intf(sum(rows,'customers'))],['New customers',intf(sum(rows,'fresh'))],['Busiest period',pk.period]];
  }
  return {range:range,type:type,cols:cols,rows:rows,chart:chart,stats:stats,date:today()};
}
function toCSV(res){
  var q = function(v){ v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var lines = [res.cols.map(function(c){return q(c.label);}).join(',')];
  res.rows.forEach(function(row){ lines.push(res.cols.map(function(c){return q(row[c.k]);}).join(',')); });
  return lines.join('\n');
}
function reportTable(res){
  return '<table><thead><tr>'+res.cols.map(function(c){return '<th'+(c.num?' class="num"':'')+'>'+esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>'+
    res.rows.map(function(row){ return '<tr>'+res.cols.map(function(c){ return '<td'+(c.num?' class="num"':'')+'>'+esc(c.fmt?c.fmt(row[c.k]):row[c.k])+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>';
}
function barsHTML(res){
  var max = Math.max.apply(null,res.rows.map(function(r){return r[res.chart.key];}));
  return '<div class="hbars" role="img" aria-label="Bar chart of '+esc(res.cols.filter(function(c){return c.k===res.chart.key;})[0].label)+'">'+res.rows.map(function(r){
    var v = r[res.chart.key];
    return '<div class="hbar"><span class="lbl">'+esc(r[res.chart.label])+'</span><span class="track"><span class="fill" style="width:'+(max?(v/max*100):0).toFixed(1)+'%"></span></span><span class="val">'+esc(res.chart.fmt(v))+'</span></div>';
  }).join('')+'</div>';
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function stepperHTML(){
  var st = S.rp.step, names = ['Select parameters','Generate','View summary','Export'];
  return '<ol class="steps" aria-label="Report progress">'+names.map(function(n,i){
    var c = (i+1<st) ? 'done' : ((i+1===st) ? 'now' : '');
    return '<li class="'+c+'"'+((i+1===st)?' aria-current="step"':'')+'>'+n+'</li>';
  }).join('')+'</ol>';
}
function configHTML(){
  return '<form class="panel" id="rpForm">'+
    '<fieldset><legend>Date range</legend><div class="choices">'+RANGES.map(function(o){
      return '<label class="choice"><input type="radio" name="range" value="'+o[0]+'"'+(S.rp.range===o[0]?' checked':'')+'><span><strong>'+o[0]+'</strong><small>'+o[1]+'</small></span></label>';
    }).join('')+'</div></fieldset>'+
    '<fieldset><legend>Report type</legend><div class="choices">'+TYPES.map(function(o){
      return '<label class="choice"><input type="radio" name="type" value="'+o[0]+'"'+(S.rp.type===o[0]?' checked':'')+'><span><strong>'+o[0]+'</strong><small>'+o[1]+'</small></span></label>';
    }).join('')+'</div></fieldset>'+
    '<div class="row"><button class="btn btn-primary" type="submit">Generate report</button></div></form>';
}
function exportHTML(res){
  var e = S.rp.exp;
  if(e===null) return '<section class="panel"><h2>Export this report?</h2><p class="sub">You can export it as a PDF or a Microsoft Excel file, or skip this step.</p><div class="row"><button class="btn btn-primary" data-act="rp-export-yes">Yes, export</button><button class="btn" data-act="rp-export-skip">Skip export</button></div></section>';
  if(e==='skipped') return '<section class="panel"><h2>Export skipped</h2><p class="sub">The report stays on this screen until you leave it.</p><div class="row"><button class="btn btn-primary" data-act="rp-new">Generate another report</button><button class="btn" data-act="nav" data-view="dashboard">Back to dashboard</button></div></section>';
  if(e==='choose') return '<section class="panel"><h2>Choose a format</h2><div class="row"><button class="btn btn-primary" data-act="rp-fmt" data-fmt="PDF">Export as PDF</button><button class="btn btn-primary" data-act="rp-fmt" data-fmt="Excel">Export as Excel</button><button class="btn" data-act="rp-export-skip">Skip export</button></div></section>';
  var ext = e==='PDF' ? 'pdf' : 'xlsx', fname = slug(res.type)+'-'+res.range.toLowerCase()+'-'+res.date+'.'+ext;
  var csv = toCSV(res);
  var body = e==='PDF'
    ? '<div class="paper"><h3>'+esc(res.type)+' report</h3><p class="sub">'+esc(res.range)+' &middot; generated '+esc(res.date)+'</p>'+reportTable(res)+'</div>'
    : '<div class="field"><label for="csvBox">Spreadsheet rows (CSV)</label><textarea id="csvBox" rows="'+Math.min(14,res.rows.length+2)+'" readonly>'+esc(csv)+'</textarea></div>';
  return '<section class="panel"><div class="row" style="justify-content:space-between"><h2>Export preview</h2><span class="pill info">'+(e==='PDF'?'PDF':'Excel')+'</span></div>'+
    '<p class="sub">File name: <span class="mono">'+esc(fname)+'</span></p>'+body+
    '<p class="fine">This prototype shows a preview only, because files cannot be saved from this page. Copy the rows as CSV and paste them into Excel or Sheets.</p>'+
    '<div class="row"><button class="btn btn-primary" data-act="rp-copy">Copy as CSV</button><button class="btn" data-act="rp-fmt" data-fmt="'+(e==='PDF'?'Excel':'PDF')+'">Switch to '+(e==='PDF'?'Excel':'PDF')+'</button><button class="btn" data-act="rp-new">Generate another report</button></div></section>';
}
function reportsHTML(){
  var head = '<div class="head"><h1>Generate Reports</h1><p>Choose a date range and report type, generate the summary, then decide whether to export it.</p></div>'+stepperHTML();
  var st = S.rp.step;
  if(st===1) return head+configHTML();
  if(st===2) return head+'<section class="panel"><div class="row"><span class="spinner" aria-hidden="true"></span><span role="status">Generating the '+esc(S.rp.type)+' report ('+esc(S.rp.range)+')&hellip;</span></div></section>';
  var res = S.rp.result;
  return head+
    '<section class="panel"><div class="row" style="justify-content:space-between"><div><h2>'+esc(res.type)+'</h2><p class="sub">'+esc(res.range)+' &middot; generated '+esc(res.date)+' &middot; sample figures</p></div>'+
      '<button class="btn" data-act="rp-change">Change parameters</button></div>'+
      '<div class="rstats">'+res.stats.map(function(s){return '<div class="rstat"><span>'+esc(s[0])+'</span><b>'+esc(s[1])+'</b></div>';}).join('')+'</div>'+
      barsHTML(res)+'</section>'+
    '<div class="tablewrap">'+reportTable(res)+'</div>'+exportHTML(res);
}
function generate(form){
  S.rp.range = form.range.value; S.rp.type = form.type.value;
  S.rp.result = null; S.rp.exp = null; S.rp.step = 2; render();
  setTimeout(function(){
    S.rp.result = buildReport(S.rp.range,S.rp.type); S.rp.step = 3; S.rp.exp = null;
    if(S.authed && S.view==='reports') render();
  },700);
}
function copyCSV(){
  var csv = toCSV(S.rp.result);
  var fallback = function(){
    var box = $('#csvBox');
    if(box){ box.focus(); box.select(); toast('Press Ctrl+C (or Cmd+C) to copy the selected rows.'); }
    else toast('Copy is not available here. Switch to Excel to select the rows manually.');
  };
  try{
    navigator.clipboard.writeText(csv).then(function(){ toast('CSV copied. Paste it into Excel or Sheets.'); },fallback);
  }catch(e){ fallback(); }
}

/* ---------- render + routing ---------- */
function viewHTML(){
  return {dashboard:dashHTML,users:usersHTML,orders:ordersHTML,reports:reportsHTML}[S.view]();
}
function render(){
  var app = $('#app');
  app.innerHTML = S.authed ? shellHTML(viewHTML()) : loginHTML();
  if(!S.authed){ var u=$('#user'); if(u) u.focus(); }
}
function hashView(){ var h = location.hash.slice(1); return VIEWS.indexOf(h)>-1 ? h : null; }
function go(v,o){
  o = o||{};
  S.view = v;
  if(v==='users'){ S.uv.mode='list'; S.uv.id=null; if(o.ustatus){ S.uv.status=o.ustatus; S.uv.role='all'; S.uv.q=''; } }
  if(v==='orders'){ S.om.editOrder=null; S.om.editMenu=null; S.om.del=false; if(o.tab) S.om.tab=o.tab; if(o.ostatus) S.om.ostatus=o.ostatus; if(o.mstock) S.om.mstock=o.mstock; }
  try{ location.hash = v; }catch(e){}
  render(); window.scrollTo(0,0);
}

/* ---------- events ---------- */
function focusDelete(act){
  var btn = $('[data-act='+act+']');
  if(btn){ btn.focus(); if(btn.scrollIntoView) btn.scrollIntoView({block:'nearest'}); }
}
var app = $('#app');
app.addEventListener('click',function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var d = b.dataset;
  switch(d.act){
    case 'nav': go(d.view); break;
    case 'dash-go': go(d.view,{tab:d.tab,ustatus:d.ustatus,ostatus:d.ostatus,mstock:d.mstock}); break;
    case 'logout': logout(); break;
    case 'u-list': S.uv.mode='list'; S.uv.id=null; S.uv.del=false; render(); window.scrollTo(0,0); break;
    case 'u-history': S.uv.mode='profile'; S.uv.id=d.id; render(); window.scrollTo(0,0); break;
    case 'u-edit': S.uv.mode='edit'; S.uv.id=d.id; S.uv.del=false; render(); window.scrollTo(0,0); break;
    case 'u-new': S.uv.mode='new'; S.uv.id=null; S.uv.del=false; render(); window.scrollTo(0,0); break;
    case 'u-del': S.uv.del=true; render(); focusDelete('u-del-no'); break;
    case 'u-del-no': S.uv.del=false; render(); break;
    case 'u-del-yes': deleteUser(); break;
    case 'o-clear': S.om.oq=''; S.om.ostatus='active'; render(); break;
    case 'm-clear': S.om.mq=''; S.om.mcat='all'; S.om.mstock='all'; render(); break;
    case 'm-new': S.om.editMenu='new'; S.om.del=false; render(); window.scrollTo(0,0); break;
    case 'm-del': S.om.del=true; render(); focusDelete('m-del-no'); break;
    case 'm-del-no': S.om.del=false; render(); break;
    case 'm-del-yes': deleteMenu(); break;
    case 'pw-toggle': {
      var pi = $('#pass'), show = pi.type==='password';
      pi.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
      b.setAttribute('aria-pressed',String(show)); b.setAttribute('aria-label',show?'Hide password':'Show password'); pi.focus(); break;
    }
    case 'forgot': {
      var fn = $('#forgotNote'); fn.hidden = !fn.hidden; b.setAttribute('aria-expanded',String(!fn.hidden)); break;
    }
    case 'u-clear': S.uv.q=''; S.uv.role='all'; S.uv.status='all'; render(); break;
    case 'om-tab': S.om.tab=d.tab; S.om.editOrder=null; S.om.editMenu=null; S.om.del=false; render(); break;
    case 'om-order': S.om.editOrder=d.id; render(); window.scrollTo(0,0); break;
    case 'om-menu': S.om.editMenu=d.id; S.om.del=false; render(); window.scrollTo(0,0); break;
    case 'om-cancel': S.om.editOrder=null; S.om.editMenu=null; S.om.del=false; render(); break;
    case 'rp-export-yes': S.rp.exp='choose'; S.rp.step=4; render(); break;
    case 'rp-export-skip': S.rp.exp='skipped'; S.rp.step=4; render(); break;
    case 'rp-fmt': S.rp.exp=d.fmt; S.rp.step=4; render(); break;
    case 'rp-copy': copyCSV(); break;
    case 'rp-change': S.rp.step=1; S.rp.exp=null; render(); break;
    case 'rp-new': S.rp.step=1; S.rp.exp=null; S.rp.result=null; render(); window.scrollTo(0,0); break;
  }
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f = e.target;
  if(f.id==='loginForm') doLogin(f);
  else if(f.id==='userForm') saveUser(f);
  else if(f.id==='orderForm') saveOrder(f);
  else if(f.id==='menuForm') saveMenu(f);
  else if(f.id==='rpForm') generate(f);
});
app.addEventListener('input',function(e){
  var id = e.target.id;
  if(id==='uq'){ S.uv.q = e.target.value; drawUsers(); }
  else if(id==='oq'){ S.om.oq = e.target.value; drawOrders(); }
  else if(id==='mq'){ S.om.mq = e.target.value; drawMenu(); }
  else if(id==='user' || id==='pass'){ clearLoginErr(); }
});
app.addEventListener('change',function(e){
  var t = e.target;
  if(t.id==='urole'){ S.uv.role = t.value; drawUsers(); }
  else if(t.id==='ustatus'){ S.uv.status = t.value; drawUsers(); }
  else if(t.id==='ostatus'){ S.om.ostatus = t.value; drawOrders(); }
  else if(t.id==='mcat'){ S.om.mcat = t.value; drawMenu(); }
  else if(t.id==='mstock'){ S.om.mstock = t.value; drawMenu(); }
  else if(t.name==='range' && t.form && t.form.id==='rpForm'){ S.rp.range = t.value; }
  else if(t.name==='type' && t.form && t.form.id==='rpForm'){ S.rp.type = t.value; }
});
function capsCheck(e){
  if(e.target.id!=='pass' || !e.getModifierState) return;
  var n = $('#capsNote'); if(n) n.hidden = !e.getModifierState('CapsLock');
}
app.addEventListener('keydown',capsCheck);
app.addEventListener('keyup',capsCheck);
app.addEventListener('focusout',function(e){ if(e.target.id==='pass'){ var n=$('#capsNote'); if(n) n.hidden=true; } });
window.addEventListener('hashchange',function(){
  var v = hashView();
  if(S.authed && v && v!==S.view){ S.view=v; render(); }
});

S.view = hashView() || 'dashboard';
render();
})();
</script>

</body></html>
