<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kape ng Bayan Dashboard</title><meta name="color-scheme" content="dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@500;700&display=swap"><style>
/* Kape ng Bayan admin dashboard. Dark-gray stage, light icon rail, light cards, rose accent. */
:root{
  --canvas-1:#d6d6d6; --canvas-2:#9d9d9d;
  --app-1:#656565; --app-2:#363636;
  --rail-1:#d6d3d3; --rail-2:#bdbbbb;
  --card:#d9d9d9; --card-2:#cdcdcd; --card-fg:#161616; --card-muted:#6a6a6a; --line:#b9b9b9; --field:#efefef;
  --accent:#af5d51; --accent-strong:#98493e;
  --brown:#784d47; --brown-strong:#623a35;
  --search:#6f514f; --search-fg:#d9c9c6;
  --pill:#868686; --pill-dark:#6d6d6d;
  --on-dark:#ffffff; --muted-on-dark:#d0d0d0;
  --good:#17703f; --good-soft:#c9e5d4;
  --warn:#7d5200; --warn-soft:#efdba6;
  --bad:#a3261e; --bad-soft:#f1cdc9;
  --info:#1d4f9c; --info-soft:#cddcf4;
  --neutral:#4f4f4f; --neutral-soft:#c3c3c3;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-head:'Roboto','Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(180deg,var(--canvas-1),var(--canvas-2)) fixed;
  color:var(--on-dark); font-family:var(--font-body); font-size:14px; line-height:1.45;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.2;text-wrap:balance}
