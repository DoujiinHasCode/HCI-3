<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kape ng Bayan Dashboard</title><meta name="color-scheme" content="dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@500;700&display=swap"><style>
/* Kape ng Bayan admin dashboard. Dark-gray stage, light icon rail, light cards, rose accent. */
:root{
  --canvas-1:#d6d6d6; --canvas-2:#9d9d9d;
  --app-1:#656565; --app-2:#363636;
  --rail-1:#d6d3d3; --rail-2:#bdbbbb;
  --card:#d9d9d9; --card-2:#cdcdcd; --card-fg:#161616; --card-muted:#6a6a6a; --line:#b9b9b9; --field:#efefef;
  --accent:#af5d51; --accent-strong:#98493e;
  --brown:#784d47; --brown-strong:#623a35;
  --search:#6f514f; --search-fg:#d9c9c6;
  --pill:#868686; --pill-dark:#6d6d6d;
  --on-dark:#ffffff; --muted-on-dark:#d0d0d0;
  --good:#17703f; --good-soft:#c9e5d4;
  --warn:#7d5200; --warn-soft:#efdba6;
  --bad:#a3261e; --bad-soft:#f1cdc9;
  --info:#1d4f9c; --info-soft:#cddcf4;
  --neutral:#4f4f4f; --neutral-soft:#c3c3c3;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-head:'Roboto','Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh;
  background:linear-gradient(180deg,var(--canvas-1),var(--canvas-2)) fixed;
  color:var(--on-dark); font-family:var(--font-body); font-size:14px; line-height:1.45;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #ffb9ad;outline-offset:2px}
.sub{color:var(--card-muted);font-size:13px}
.fine{color:var(--card-muted);font-size:12px;line-height:1.45}
.strong{font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--font-mono);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage: rail + main ---------- */
.app{
  max-width:1480px;margin:0 auto;min-height:calc(100vh - 32px);
  border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,var(--app-1),var(--app-2));
  display:grid;grid-template-columns:92px minmax(0,1fr);
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.rail{
  background:linear-gradient(180deg,var(--rail-1),var(--rail-2));
  color:#141414;border-radius:0 24px 24px 0;
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 24px;
}
.badge{width:60px;height:60px;border-radius:50%;background:#cbbab6;display:grid;place-items:center;margin-bottom:22px;flex:none}
.badge img{width:50px;height:50px;object-fit:contain;display:block}
.rbtn{
  position:relative;width:56px;height:56px;border:0;background:transparent;border-radius:14px;
  display:grid;place-items:center;color:#141414;
}
.rbtn:hover{background:rgba(0,0,0,.07)}
.rbtn[aria-current=page]{color:var(--accent)}
.rbtn[aria-current=page]::after{content:"";position:absolute;right:-9px;top:50%;width:3px;height:26px;margin-top:-13px;border-radius:2px;background:var(--accent)}
.rail .spacer{flex:1}
.main{min-width:0;padding:26px 34px 36px}


/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.72)}
.hello{flex:1 1 280px;min-width:0}
.hello small{display:block;font-family:var(--font-head);font-weight:700;font-size:12.5px;color:#fff}
.hello .tag{font-family:var(--font-head);font-weight:700;font-size:24px;line-height:1.15;color:#fff}
.search{position:relative;flex:0 1 330px;min-width:200px}
.search input[type=search]{
  width:100%;height:40px;min-height:40px;border:0;border-radius:999px;background:var(--search);color:#fff;
  padding:0 46px 0 20px;text-align:center;font-size:13px;
}
.search input[type=search]::placeholder{color:var(--search-fg);opacity:1}
.search input[type=search]:focus{text-align:left}
.search input[type=search]::-webkit-search-cancel-button{display:none}
.search .ic{position:absolute;right:15px;top:50%;margin-top:-10px;width:20px;height:20px;color:#fff;pointer-events:none}
.bellwrap{position:relative}
.bell{position:relative;width:42px;height:42px;border:0;background:transparent;border-radius:50%;color:#fff;display:grid;place-items:center}
.bell:hover{background:rgba(255,255,255,.12)}
.bell .dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--app-1)}
.bellmenu{
  position:absolute;right:-10px;top:50px;z-index:30;width:292px;background:var(--card);color:var(--card-fg);
  border-radius:16px;padding:8px;box-shadow:0 14px 34px rgba(0,0,0,.4);
}
.bellmenu h2{font-size:14px;padding:8px 10px 6px}
.bellmenu button{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;font-size:13px}
.bellmenu button:hover{background:rgba(0,0,0,.07)}
.bellmenu .none{padding:10px;color:var(--card-muted);font-size:13px}
.bellmenu b{background:var(--accent);color:#fff;border-radius:999px;min-width:24px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 7px}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#e7c9a8,#c58d6b);color:#4a2a1d;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who{display:flex;flex-direction:column;line-height:1.2}
.who small{color:#c3c3c3;font-size:12px}
.who b{font-family:var(--font-head);font-size:14px;color:#fff;font-weight:700}
.addbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 20px 0 16px;border:0;border-radius:999px;background:var(--card);color:#2d2d2d;font-size:13px;font-weight:500}
.addbtn:hover{background:#e8e8e8}
.addbtn .ic{width:16px;height:16px;stroke-width:2.2}

/* ---------- menu screen ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:46px;margin-top:30px;align-items:start}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.chip{
  height:54px;border:0;border-radius:15px;background:var(--card);color:#111;
  display:flex;align-items:center;justify-content:center;gap:10px;padding:0 10px;
  font-family:var(--font-head);font-weight:700;font-size:15px;min-width:0;
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ic{width:21px;height:21px}
.chip:hover{background:#e6e6e6}
.chip.on{background:var(--accent);color:#fff}
.mtitle{font-family:var(--font-head);font-weight:700;font-size:23px;margin:28px 0 18px;color:#fff}
.mgrid{column-count:2;column-gap:24px}
.mcard{
  position:relative;break-inside:avoid;margin:0 0 22px;display:block;
  background:var(--card);color:var(--card-fg);border-radius:20px;padding:18px 18px 18px;
}
.mcard.off .thumb,.mcard.off .info{opacity:.55}
.tools{position:absolute;top:12px;right:14px;display:flex;gap:10px;z-index:1}
.iconbtn{border:0;background:transparent;padding:3px;border-radius:6px;display:grid;place-items:center;color:#111}
.iconbtn:hover{background:rgba(0,0,0,.1)}
.iconbtn .ic{width:19px;height:19px}
.mcard .top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:start;padding-top:22px}
.thumb{width:84px;height:80px;border-radius:14px;overflow:hidden;background:#ccc;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.info h3{font-family:var(--font-body);font-weight:600;font-size:14.5px;margin:0 0 4px}
.desc{font-size:11.5px;line-height:1.4;color:#777;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.soldout{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:1px 9px}
.stats3{display:flex;gap:24px;margin-top:16px;flex-wrap:wrap}
.stats3 div{display:flex;flex-direction:column;gap:3px}
.stats3 b{font-size:12.5px;font-weight:600}
.stats3 span{font-size:12px;color:#777}
.stats3 .star{color:#f0b429}
.mcard hr{border:0;border-top:1.5px solid #1b1b1b;margin:14px 0 12px}
.mcard .lbl{font-weight:600;font-size:13.5px}
.sizes{display:flex;gap:16px;margin:12px 0 18px}
.size{width:46px;height:24px;border:0;border-radius:7px;background:var(--pill);color:#fff;font-size:11px;font-weight:600}
.size:hover{background:#767676}
.size[aria-pressed=true]{background:var(--brown)}
.pbtn{
  display:flex;width:100%;height:32px;align-items:center;justify-content:center;border:0;border-radius:999px;
  background:var(--brown);color:#fff;font-weight:600;font-size:12.5px;
}
.pbtn:hover{background:var(--brown-strong)}
.pbtn:disabled{background:#9b9b9b;cursor:not-allowed}
.mcard .gap{height:6px}
.less{display:block;margin:10px auto 0;border:0;background:transparent;color:#666;font-size:11.5px;text-decoration:underline;padding:2px 6px}
.center{display:flex;justify-content:center;margin-top:12px}
.more{width:132px;height:24px;border:0;border-radius:999px;background:var(--pill-dark);color:#fff;font-size:11.5px}
.more:hover{background:#5d5d5d}
.nores{background:var(--card);color:var(--card-fg);border-radius:20px;padding:28px;text-align:center;color:#555}
.nores .btn{margin:4px 2px}

/* ---------- order panel ---------- */
.order{background:var(--card);color:var(--card-fg);border-radius:24px;padding:26px 24px 24px;position:sticky;top:16px;display:flex;flex-direction:column;gap:18px}
.op-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.op-head h2{font-size:21px;font-weight:700}
.oid{font-family:var(--font-head);font-weight:700;font-size:17px;color:#777}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{height:34px;border:0;border-radius:999px;background:#c6c6c6;color:#111;font-weight:600;font-size:13px}
.seg button:hover{background:#bdbdbd}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.olines{display:flex;flex-direction:column;gap:18px}
.oline{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:12px;align-items:start}
.oline .thumb{width:66px;height:62px;border-radius:12px}
.oline b{font-size:14px;font-weight:600}
.meta{margin:5px 0 0;font-size:11px;font-weight:500;display:grid;gap:2px}
.meta div{display:grid;grid-template-columns:58px 1fr;align-items:center;min-height:20px}
.meta dt{font-weight:500}
.meta dd{margin:0;display:flex;align-items:center;gap:6px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:20px;height:20px;border:0;border-radius:50%;background:#bdbdbd;color:#111;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.qty button:hover{background:#a9a9a9}
.qty output{min-width:14px;text-align:center}
.oprice{text-align:right;font-size:12px}
.oprice b{display:block;font-size:13.5px;margin-bottom:4px}
.oprice span{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.oempty{padding:20px 6px;text-align:center;color:#666;font-size:13px}
.sum{display:grid;gap:6px;font-weight:600;font-size:13.5px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .total{border-top:1.5px solid #555;padding-top:12px;margin-top:6px;font-size:14px}
.sum .total span:last-child{font-size:15px;font-variant-numeric:tabular-nums}
.pay h3{font-family:var(--font-body);font-size:13.5px;font-weight:600;margin-bottom:10px}
.pays{display:flex;flex-wrap:wrap;gap:8px}
.pays button{height:26px;padding:0 14px;border:0;border-radius:999px;background:#c9c9c9;color:#eee;font-size:12px;font-weight:600}
.pays button:hover{background:#bcbcbc}
.pays button[aria-pressed=true]{background:#727272;color:#fff}
.proc{display:flex;flex-direction:column;align-items:center;gap:8px}
.proc .pbtn{width:190px;height:38px;font-size:14px}
.linkbtn{border:0;background:transparent;color:#666;font-size:12px;text-decoration:underline;padding:2px 6px}

/* ---------- shared: headings, cards, forms, tables (other screens) ---------- */
.head{display:flex;flex-direction:column;gap:6px;margin:30px 0 20px}
.head h1{font-size:26px;font-weight:700;color:#fff}
.head p{color:var(--muted-on-dark);max-width:64ch}
.head-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.view>*+*{margin-top:18px}
.view>.head{margin-bottom:0}
.panel{background:var(--card);color:var(--card-fg);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.edit{outline:2px solid var(--accent);outline-offset:-2px}
.panel.warn{outline:2px solid var(--bad);outline-offset:-2px}
.panel h2{font-size:18px}
.panel h3{font-size:16px}
.tablewrap{overflow-x:auto;border-radius:20px;background:var(--card);color:var(--card-fg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#555;text-align:left;padding:13px 16px;background:var(--card-2);white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
th.num{text-align:right}
td.actions{text-align:right;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:#666}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar .field{flex:1 1 180px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;min-height:38px;border-radius:999px;border:0;background:#c4c4c4;color:#161616;font-weight:600;font-size:13.5px;line-height:1.2}
.btn:hover{background:#b6b6b6}
.btn-primary{background:var(--brown);color:#fff}
.btn-primary:hover{background:var(--brown-strong)}
.btn-quiet{background:transparent;color:var(--brown-strong);padding:6px 12px;min-height:34px}
.btn-quiet:hover{background:rgba(0,0,0,.08)}
.head .btn-quiet{color:#fff}
.head .btn-quiet:hover{background:rgba(255,255,255,.14)}
.btn-danger{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-danger-solid{background:var(--bad);color:#fff}
.btn-danger-solid:hover{background:#8a1f19}
.btn:disabled{opacity:.6;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--neutral-soft);color:var(--neutral)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,legend{font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{
  width:100%;min-height:42px;padding:9px 13px;border:1px solid #b4b4b4;border-radius:12px;background:var(--field);color:#161616;
}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.panel input::placeholder,dialog input::placeholder,dialog textarea::placeholder{color:#7a7a7a}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.err{color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:9px 12px;font-size:13.5px}
.err[hidden],[hidden]{display:none!important}
.notice{color:var(--good);background:var(--good-soft);border-radius:10px;padding:9px 12px;font-size:13.5px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--brown)}
fieldset{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:8px}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline time{font-family:var(--font-mono);font-size:12.5px;color:#666}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:0}
.facts dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#666}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}

.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:500;color:#d0d0d0;counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:600}
.steps li.done{color:#fff}
.steps li.done::before{background:var(--good);color:#fff}
.steps li.now{background:var(--accent);color:#fff}
.steps li.now::before{background:#fff;color:var(--accent-strong)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid #b4b4b4;border-radius:14px;cursor:pointer;background:var(--field)}
.choice input{margin-top:3px;width:16px;height:16px;accent-color:var(--brown);flex:none}
.choice:has(input:checked){border-color:var(--accent);background:#f6e3df}
.choice span{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice small{color:#666;font-size:12.5px}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rstat{padding:12px 14px;border-radius:14px;background:var(--field);min-width:0}
.rstat b{display:block;font-family:var(--font-head);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.rstat span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#666}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(84px,28%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .lbl{overflow-wrap:anywhere}
.hbar .track{height:14px;background:#bdbdbd;border-radius:4px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:4px}
.hbar .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:right}
.paper{background:#fff;color:#1a1a1a;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.paper h3{font-family:var(--font-head)}
.paper table{font-size:13px;color:#1a1a1a}
.paper th{background:#f0f0f0;color:#444}
.paper td{border-top:1px solid #e3e3e3}
.paper .sub{color:#555}
textarea#csvBox{font-family:var(--font-mono);font-size:12.5px;background:var(--field)}
.spinner{width:18px;height:18px;border:2px solid #aaa;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{height:34px;padding:0 16px;border:0;border-radius:999px;background:#c6c6c6;color:#111;font-weight:600;font-size:13px}
.presets button:hover{background:#b8b8b8}

/* ---------- login ---------- */
.app.solo{grid-template-columns:minmax(0,1fr);place-items:center;padding:32px 16px}
.login{width:min(420px,100%);background:var(--card);color:var(--card-fg);border-radius:26px;padding:34px 32px 28px;display:flex;flex-direction:column;gap:18px}
.login .logo{display:block;width:190px;max-width:70%;height:auto;margin:0 auto}
.head-center{text-align:center}
.head-center h2{font-size:21px}
.login form{display:flex;flex-direction:column;gap:14px}
.login .btn-primary{height:44px;font-size:14px}
.pw{position:relative}
.pw input{padding-right:72px}
.pwtoggle{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.caps{color:var(--warn);font-weight:500}
.hint{text-align:center;background:rgba(0,0,0,.07);border-radius:10px;padding:9px 10px}
.demo{font-size:12px;color:var(--card-muted)}
.demo summary{cursor:pointer;width:max-content}
.demo p{margin-top:6px}

/* ---------- dialog + toasts ---------- */
dialog{border:0;border-radius:22px;padding:24px;background:var(--card);color:var(--card-fg);width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(18,18,18,.62)}
dialog form{display:flex;flex-direction:column;gap:14px}
dialog h2{font-size:20px}
#toasts{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{background:#1b1b1b;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;max-width:min(92vw,460px);box-shadow:0 8px 24px rgba(0,0,0,.35)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr);gap:30px}
  .order{position:static;max-width:520px}
}
@media (max-width:860px){
  body{padding:0}
  .app{grid-template-columns:minmax(0,1fr);border-radius:0;min-height:100vh;box-shadow:none}
  .app.solo{padding:24px 14px}
  .rail{flex-direction:row;border-radius:0 0 22px 22px;padding:12px 14px;gap:2px;overflow-x:auto;justify-content:flex-start}
  .badge{width:46px;height:46px;margin:0 10px 0 0}
  .badge img{width:38px;height:38px}
  .rbtn{width:48px;height:48px}
  .rbtn[aria-current=page]::after{right:auto;left:50%;top:auto;bottom:-3px;margin:0 0 0 -13px;width:26px;height:3px}
  .rail .spacer{display:none}
  .rail .rbtn:last-child{margin-left:auto}
  .main{padding:20px 16px 30px}
  .hello .tag{font-size:20px}
  .search{flex:1 1 100%}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .timeline li{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (max-width:560px){
  .mgrid{column-count:1}
  .addbtn{margin-left:auto}
  .login{padding:28px 20px 24px}
}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}

var STATUSES = ['Pending','Preparing','Ready','Completed','Cancelled'];
var CATEGORIES = ['Topping','Coffee','Ground Coffee','Snack'];

var peso = function(n){ return '₱' + Math.round(n).toLocaleString('en-US'); };
var peso2 = function(n){ return '₱' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
var intf = function(n){ return Number(n).toLocaleString('en-US'); };
var $ = function(s,el){ return (el||document).querySelector(s); };
var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var today = function(){ return new Date().toISOString().slice(0,10); };
var timeNow = function(){ return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
var PILL = {Active:'good',Suspended:'bad',Pending:'warn',Preparing:'info',Ready:'good',Completed:'neutral',Cancelled:'bad'};
var pill = function(t){ return '<span class="pill '+(PILL[t]||'neutral')+'">'+esc(t)+'</span>'; };

function nextId(list,prefix,width){
  var n = list.reduce(function(a,x){ return Math.max(a,Number(x.id.slice(prefix.length))||0); },0)+1, t = String(n);
  while(t.length<width) t = '0'+t;
  return prefix+t;
}
function toast(msg){
  var box = $('#toasts'); var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; box.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3200);
}

/* ---------- login logic (validate, lock after repeated failures) ---------- */
var LK = {fails:0, until:0, busy:false, timer:null};
var MAX_TRIES = 5, LOCK_SECS = 30;
function lockLeft(){ return Math.max(0, Math.ceil((LK.until-Date.now())/1000)); }
function showLoginErr(msg,lock){
  var err = $('#loginErr'); if(!err) return;
  err.textContent = msg; err.hidden = false;
  if(lock) err.setAttribute('data-lock','1'); else err.removeAttribute('data-lock');
}
function clearLoginErr(){
  var err = $('#loginErr');
  if(err && !err.hasAttribute('data-lock')) err.hidden = true;
  ['user','pass'].forEach(function(id){ var el = $('#'+id); if(el) el.removeAttribute('aria-invalid'); });
}
function paintLock(){
  var btn = $('#loginBtn');
  if(!btn){ clearInterval(LK.timer); LK.timer = null; return; }
  var left = lockLeft();
  if(left>0){ btn.disabled = true; btn.textContent = 'Try again in '+left+'s'; return; }
  clearInterval(LK.timer); LK.timer = null; LK.fails = 0;
  btn.disabled = false; btn.textContent = 'Sign in';
  var err = $('#loginErr');
  if(err && err.hasAttribute('data-lock')){ err.hidden = true; err.removeAttribute('data-lock'); }
}

function doLogin(form){
  if(LK.busy || lockLeft()>0) return;
  var u = form.user.value.trim(), p = form.pass.value, btn = $('#loginBtn');
  clearLoginErr();
  if(!u || !p){
    showLoginErr('Enter your username and password.');
    var bad = u ? form.pass : form.user; bad.setAttribute('aria-invalid','true'); bad.focus(); return;
  }
  LK.busy = true; btn.disabled = true; btn.textContent = 'Signing in…';
  setTimeout(function(){
    LK.busy = false;
    if(u.toLowerCase() === 'admin' && p === 'admin123'){
      LK.fails = 0; S.authed = true; S.notice = '';
      S.view = hashView() || 'menu';
      render(); window.scrollTo(0,0); return;
    }
    LK.fails++;
    form.pass.value = '';
    form.user.setAttribute('aria-invalid','true'); form.pass.setAttribute('aria-invalid','true');
    if(LK.fails >= MAX_TRIES){
      LK.until = Date.now()+LOCK_SECS*1000;
      showLoginErr('Too many failed attempts. Sign-in is paused for '+LOCK_SECS+' seconds.',true);
      paintLock(); LK.timer = setInterval(paintLock,1000);
      return;
    }
    var left = MAX_TRIES-LK.fails;
    showLoginErr('Incorrect username or password. '+left+(left===1?' attempt':' attempts')+' left before sign-in pauses.');
    btn.disabled = false; btn.textContent = 'Sign in'; form.pass.focus();
  },450);
}

/* ---------- order panel ---------- */
function lineUnit(l){
  var m = byId(l.item), t = l.top ? byId(l.top) : null;
  return (m ? m.price + (m.category==='Coffee' ? SIZE_ADD[l.size]||0 : 0) : 0) + (t ? t.price : 0);
}
function cartSub(){ return S.cart.lines.reduce(function(a,l){ return a + lineUnit(l)*l.qty; },0); }
function cartQty(){ return S.cart.lines.reduce(function(a,l){ return a + l.qty; },0); }
function cartTotal(){ return Math.round(cartSub()*(100-S.discount))/100; }
function lineLabel(l){
  var m = byId(l.item), t = l.top ? byId(l.top) : null, bits = [];
  if(m.category==='Coffee') bits.push(l.size);
  if(t) bits.push(t.name);
  return m.name+(bits.length?' ('+bits.join(', ')+')':'')+(l.qty>1?' x'+l.qty:'');
}
function orderInner(){
  var c = S.cart, id = nextId(S.orders,'',4);
  var lines = c.lines.length ? c.lines.map(function(l){
    var m = byId(l.item), t = l.top ? byId(l.top) : null; if(!m) return '';
    return '<div class="oline"><div class="thumb">'+art(m)+'</div><div><b>'+esc(m.name)+'</b><dl class="meta">'+
      '<div><dt>Topping</dt><dd>: '+(t?esc(t.name):'None')+'</dd></div>'+

    '</dl></div><div class="oprice"><b>Price</b><span>'+peso2(lineUnit(l)*l.qty)+'</span></div></div>';
  }).join('') : '<p class="oempty">No items yet. Pick a drink from the menu to start an order.</p>';
  return '<div class="op-head"><h2>Order</h2><span class="oid">#order'+id+'</span></div>'+
    '<div class="seg" role="group" aria-label="Order type">'+ORDER_TYPES.map(function(t){ return '<button type="button" data-act="o-type" data-v="'+t+'" aria-pressed="'+(c.type===t)+'">'+t+'</button>'; }).join('')+'</div>'+
    '<div class="olines">'+lines+'</div>'+
    '<div class="sum"><div><span>Items</span><span>'+cartQty()+'</span></div><div><span>Discount</span><span>'+S.discount+'%</span></div>'+
      '<div class="total"><span>Total</span><span>'+peso2(cartTotal())+'</span></div></div>'+
    '<div class="pay"><h3>Payment</h3><div class="pays" role="group" aria-label="Payment method">'+PAYS.map(function(p){ return '<button type="button" data-act="o-pay" data-v="'+p+'" aria-pressed="'+(c.pay===p)+'">'+p+'</button>'; }).join('')+'</div></div>'+
    '<div class="proc"><button type="button" class="pbtn" data-act="process">Process</button>'+(c.lines.length?'<button type="button" class="linkbtn" data-act="o-clear-cart">Clear order</button>':'')+'</div>';
}
function menuViewHTML(){
  return '<div class="layout"><section id="menuArea" aria-label="Menu">'+menuAreaHTML()+'</section><aside class="order" id="orderPanel" aria-label="Current order">'+orderInner()+'</aside></div>';
}
function drawMenu(){ var a = $('#menuArea'); if(a) a.innerHTML = menuAreaHTML(); }
function drawCart(){ var a = $('#orderPanel'); if(a) a.innerHTML = orderInner(); }

function mergeLines(){
  var out = [];
  S.cart.lines.forEach(function(l){
    var t = out.find(function(x){ return x.item===l.item && x.size===l.size && x.top===l.top; });
    if(t) t.qty += l.qty; else out.push(l);
  });
  S.cart.lines = out;
}
function addToCart(id){
  var m = byId(id); if(!m || !m.available) return;
  if(m.category==='Topping'){
    var last = null, i;
    for(i=S.cart.lines.length-1;i>=0;i--){ var lm = byId(S.cart.lines[i].item); if(lm && lm.category==='Coffee'){ last = S.cart.lines[i]; break; } }
    if(!last){ toast('Add a drink first, then pick a topping.'); return; }
    last.top = m.id; mergeLines(); drawCart(); toast(m.name+' added to '+byId(last.item).name+'.'); return;
  }
  var size = m.category==='Coffee' ? (S.size[id]||'M') : '';
  var line = S.cart.lines.find(function(l){ return l.item===id && l.size===size && !l.top; });
  if(line) line.qty++; else S.cart.lines.push({id:'L'+(++S.lineSeq),item:id,size:size,top:null,qty:1});
  drawCart(); toast(m.name+(size?' ('+size+')':'')+' added to the order.');
}
function changeQty(lineId,d){
  var l = S.cart.lines.find(function(x){return x.id===lineId;}); if(!l) return;
  l.qty += d;
  if(l.qty<1) S.cart.lines = S.cart.lines.filter(function(x){return x!==l;});
  drawCart();
}
function processOrder(){
  var c = S.cart;
  if(!c.lines.length){ toast('Add at least one item first.'); return; }
  var id = nextId(S.orders,'',4), total = cartTotal();
  S.orders.unshift({id:id,customer:'Walk-in',items:c.lines.map(lineLabel).join(', '),total:total,status:'Pending',time:timeNow(),type:c.type,pay:c.pay});
  c.lines = [];
  drawCart();
  var h = $('#bellMenu'); if(h && !h.hidden) h.innerHTML = bellHTML();
  toast('Order #order'+id+' sent. Total '+peso2(total)+'.');
}

var RANGES = [['Daily','Last 7 days, one row per day'],['Weekly','Last 4 weeks, one row per week'],['Monthly','Last 6 months, one row per month']];
var TYPES = [['Sales Revenue','Orders and revenue per period'],['Product Performance','Units sold and revenue per menu item'],['Customer Volume','Customers served and new customers per period']];

function rng(seed){ var s=0,i; for(i=0;i<seed.length;i++) s=(s*31+seed.charCodeAt(i))>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function periodLabels(range){
  var now = new Date(), out = [], i, d, a, b;
  var f = function(x){ return x.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
  if(range==='Daily'){ for(i=6;i>=0;i--){ d=new Date(now); d.setDate(d.getDate()-i); out.push(d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})); } }
  else if(range==='Weekly'){ for(i=3;i>=0;i--){ a=new Date(now); a.setDate(a.getDate()-i*7-6); b=new Date(now); b.setDate(b.getDate()-i*7); out.push(f(a)+' – '+f(b)); } }
  else { for(i=5;i>=0;i--){ d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push(d.toLocaleDateString('en-US',{month:'short',year:'numeric'})); } }
  return out;
}
function sum(rows,k){ return rows.reduce(function(a,r){return a+r[k];},0); }
function peak(rows,k){ return rows.reduce(function(a,r){return r[k]>a[k]?r:a;},rows[0]); }

function buildReport(range,type){
  var r = rng(range+type), k = {Daily:1,Weekly:7,Monthly:30}[range], labels = periodLabels(range), rows, cols, chart, stats, pk;
  if(type==='Sales Revenue'){
    rows = labels.map(function(l){ var o=Math.round((38+r()*22)*k), t=165+r()*55; return {period:l,orders:o,revenue:Math.round(o*t)}; });
    cols = [{k:'period',label:'Period'},{k:'orders',label:'Orders',num:1,fmt:intf},{k:'revenue',label:'Revenue',num:1,fmt:peso}];
    chart = {key:'revenue',label:'period',fmt:peso};
    pk = peak(rows,'revenue');
    stats = [['Total revenue',peso(sum(rows,'revenue'))],['Total orders',intf(sum(rows,'orders'))],['Best period',pk.period]];
  } else if(type==='Product Performance'){
    rows = S.menu.map(function(m){ var u=Math.round((20+r()*60)*k); return {item:m.name,units:u,revenue:u*m.price}; }).sort(function(a,b){return b.units-a.units;});
    cols = [{k:'item',label:'Menu item'},{k:'units',label:'Units sold',num:1,fmt:intf},{k:'revenue',label:'Revenue',num:1,fmt:peso}];
    chart = {key:'units',label:'item',fmt:intf};
    stats = [['Units sold',intf(sum(rows,'units'))],['Revenue',peso(sum(rows,'revenue'))],['Top seller',rows[0].item]];
  } else {
    rows = labels.map(function(l){ var c=Math.round((30+r()*25)*k*0.8); return {period:l,customers:c,fresh:Math.round(c*(0.12+r()*0.15))}; });
    cols = [{k:'period',label:'Period'},{k:'customers',label:'Customers',num:1,fmt:intf},{k:'fresh',label:'New customers',num:1,fmt:intf}];
    chart = {key:'customers',label:'period',fmt:intf};
    pk = peak(rows,'customers');
    stats = [['Customers served',intf(sum(rows,'customers'))],['New customers',intf(sum(rows,'fresh'))],['Busiest period',pk.period]];
  }
  return {range:range,type:type,cols:cols,rows:rows,chart:chart,stats:stats,date:today()};
}
function toCSV(res){
  var q = function(v){ v=String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var lines = [res.cols.map(function(c){return q(c.label);}).join(',')];
  res.rows.forEach(function(row){ lines.push(res.cols.map(function(c){return q(row[c.k]);}).join(',')); });
  return lines.join('\n');
}
function reportTable(res){
  return '<table><thead><tr>'+res.cols.map(function(c){return '<th'+(c.num?' class="num"':'')+'>'+esc(c.label)+'</th>';}).join('')+'</tr></thead><tbody>'+
    res.rows.map(function(row){ return '<tr>'+res.cols.map(function(c){ return '<td'+(c.num?' class="num"':'')+'>'+esc(c.fmt?c.fmt(row[c.k]):row[c.k])+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>';
}
function barsHTML(res){
  var max = Math.max.apply(null,res.rows.map(function(r){return r[res.chart.key];}));
  return '<div class="hbars" role="img" aria-label="Bar chart of '+esc(res.cols.filter(function(c){return c.k===res.chart.key;})[0].label)+'">'+res.rows.map(function(r){
    var v = r[res.chart.key];
    return '<div class="hbar"><span class="lbl">'+esc(r[res.chart.label])+'</span><span class="track"><span class="fill" style="width:'+(max?(v/max*100):0).toFixed(1)+'%"></span></span><span class="val">'+esc(res.chart.fmt(v))+'</span></div>';
  }).join('')+'</div>';
}
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function stepperHTML(){
  var st = S.rp.step, names = ['Select parameters','Generate','View summary','Export'];
  return '<ol class="steps" aria-label="Report progress">'+names.map(function(n,i){
    var c = (i+1<st) ? 'done' : ((i+1===st) ? 'now' : '');
    return '<li class="'+c+'"'+((i+1===st)?' aria-current="step"':'')+'>'+n+'</li>';
  }).join('')+'</ol>';
}
function configHTML(){
  return '<form class="panel" id="rpForm">'+
    '<fieldset><legend>Date range</legend><div class="choices">'+RANGES.map(function(o){
      return '<label class="choice"><input type="radio" name="range" value="'+o[0]+'"'+(S.rp.range===o[0]?' checked':'')+'><span><strong>'+o[0]+'</strong><small>'+o[1]+'</small></span></label>';
    }).join('')+'</div></fieldset>'+
    '<fieldset><legend>Report type</legend><div class="choices">'+TYPES.map(function(o){
      return '<label class="choice"><input type="radio" name="type" value="'+o[0]+'"'+(S.rp.type===o[0]?' checked':'')+'><span><strong>'+o[0]+'</strong><small>'+o[1]+'</small></span></label>';
    }).join('')+'</div></fieldset>'+
    '<div class="row"><button class="btn btn-primary" type="submit">Generate report</button></div></form>';
}
function exportHTML(res){
  var e = S.rp.exp;
  if(e===null) return '<section class="panel"><h2>Export this report?</h2><p class="sub">You can export it as a PDF or a Microsoft Excel file, or skip this step.</p><div class="row"><button class="btn btn-primary" data-act="rp-export-yes">Yes, export</button><button class="btn" data-act="rp-export-skip">Skip export</button></div></section>';
  if(e==='skipped') return '<section class="panel"><h2>Export skipped</h2><p class="sub">The report stays on this screen until you leave it.</p><div class="row"><button class="btn btn-primary" data-act="rp-new">Generate another report</button><button class="btn" data-act="nav" data-view="menu">Back to menu</button></div></section>';
  if(e==='choose') return '<section class="panel"><h2>Choose a format</h2><div class="row"><button class="btn btn-primary" data-act="rp-fmt" data-fmt="PDF">Export as PDF</button><button class="btn btn-primary" data-act="rp-fmt" data-fmt="Excel">Export as Excel</button><button class="btn" data-act="rp-export-skip">Skip export</button></div></section>';
  var ext = e==='PDF' ? 'pdf' : 'xlsx', fname = slug(res.type)+'-'+res.range.toLowerCase()+'-'+res.date+'.'+ext;
  var csv = toCSV(res);
  var body = e==='PDF'
    ? '<div class="paper"><h3>'+esc(res.type)+' report</h3><p class="sub">'+esc(res.range)+' &middot; generated '+esc(res.date)+'</p>'+reportTable(res)+'</div>'
    : '<div class="field"><label for="csvBox">Spreadsheet rows (CSV)</label><textarea id="csvBox" rows="'+Math.min(14,res.rows.length+2)+'" readonly>'+esc(csv)+'</textarea></div>';
  return '<section class="panel"><div class="row" style="justify-content:space-between"><h2>Export preview</h2><span class="pill info">'+(e==='PDF'?'PDF':'Excel')+'</span></div>'+
    '<p class="sub">File name: <span class="mono">'+esc(fname)+'</span></p>'+body+
    '<p class="fine">This prototype shows a preview only, because files cannot be saved from this page. Copy the rows as CSV and paste them into Excel or Sheets.</p>'+
    '<div class="row"><button class="btn btn-primary" data-act="rp-copy">Copy as CSV</button><button class="btn" data-act="rp-fmt" data-fmt="'+(e==='PDF'?'Excel':'PDF')+'">Switch to '+(e==='PDF'?'Excel':'PDF')+'</button><button class="btn" data-act="rp-new">Generate another report</button></div></section>';
}
function reportsHTML(){
  var head = '<div class="head"><h1>Generate Reports</h1><p>Choose a date range and report type, generate the summary, then decide whether to export it.</p></div>'+stepperHTML();
  var st = S.rp.step;
  if(st===1) return head+configHTML();
  if(st===2) return head+'<section class="panel"><div class="row"><span class="spinner" aria-hidden="true"></span><span role="status">Generating the '+esc(S.rp.type)+' report ('+esc(S.rp.range)+')&hellip;</span></div></section>';
  var res = S.rp.result;
  return head+
    '<section class="panel"><div class="row" style="justify-content:space-between"><div><h2>'+esc(res.type)+'</h2><p class="sub">'+esc(res.range)+' &middot; generated '+esc(res.date)+' &middot; sample figures</p></div>'+
      '<button class="btn" data-act="rp-change">Change parameters</button></div>'+
      '<div class="rstats">'+res.stats.map(function(s){return '<div class="rstat"><span>'+esc(s[0])+'</span><b>'+esc(s[1])+'</b></div>';}).join('')+'</div>'+
      barsHTML(res)+'</section>'+
    '<div class="tablewrap">'+reportTable(res)+'</div>'+exportHTML(res);
}
function generate(form){
  S.rp.range = form.range.value; S.rp.type = form.type.value;
  S.rp.result = null; S.rp.exp = null; S.rp.step = 2; render();
  setTimeout(function(){
    S.rp.result = buildReport(S.rp.range,S.rp.type); S.rp.step = 3; S.rp.exp = null;
    if(S.authed && S.view==='reports') render();
  },700);
}
function copyCSV(){
  var csv = toCSV(S.rp.result);
  var fallback = function(){
    var box = $('#csvBox');
    if(box){ box.focus(); box.select(); toast('Press Ctrl+C (or Cmd+C) to copy the selected rows.'); }
    else toast('Copy is not available here. Switch to Excel to select the rows manually.');
  };
  try{
    navigator.clipboard.writeText(csv).then(function(){ toast('CSV copied. Paste it into Excel or Sheets.'); },fallback);
  }catch(e){ fallback(); }
}



/* ---------- render + routing ---------- */
function viewHTML(){
  return {menu:menuViewHTML,discounts:discountsHTML,orders:ordersHTML,reports:reportsHTML,users:usersHTML}[S.view]();
}
function render(){
  var app = $('#app');
  app.innerHTML = S.authed ? shellHTML(viewHTML()) : loginHTML();
  if(!S.authed){ var u = $('#user'); if(u) u.focus(); }
}
function hashView(){ var h = location.hash.slice(1); return VIEWS.indexOf(h)>-1 ? h : null; }
function go(v,o){
  o = o||{};
  S.view = v;
  if(v==='users'){ S.uv.mode='list'; S.uv.id=null; S.uv.del=false; if(o.ustatus){ S.uv.status=o.ustatus; S.uv.role='all'; S.uv.q=''; } }
  if(v==='orders'){ S.om.editOrder=null; if(o.ostatus){ S.om.ostatus=o.ostatus; S.om.oq=''; } }
  try{ location.hash = v; }catch(e){}
  render(); window.scrollTo(0,0);
}
function closeBell(){
  var m = $('#bellMenu'), b = $('.bell');
  if(m && !m.hidden){ m.hidden = true; if(b) b.setAttribute('aria-expanded','false'); }
}
function toggleBell(){
  var m = $('#bellMenu'), b = $('.bell'); if(!m) return;
  if(m.hidden){ m.innerHTML = bellHTML(); m.hidden = false; b.setAttribute('aria-expanded','true'); }
  else closeBell();
}

/* ---------- events ---------- */
var app = $('#app');
app.addEventListener('click',function(e){
  var b = e.target.closest('[data-act]');
  if(!b || b.dataset.act!=='bell'){ if(!e.target.closest('.bellwrap')) closeBell(); }
  if(!b) return;
  var d = b.dataset;
  switch(d.act){
    case 'nav': go(d.view); break;
    case 'logout': logout(); break;
    case 'bell': toggleBell(); break;
    case 'bell-go': closeBell(); go(d.view,{ostatus:d.ostatus,ustatus:d.ustatus}); break;
    case 'cat': S.cat = d.cat; S.q = ''; var gq = $('#gq'); if(gq) gq.value = ''; drawMenu(); break;
    case 'q-clear': S.q = ''; var gq2 = $('#gq'); if(gq2) gq2.value = ''; drawMenu(); break;
    case 'm-more': S.open[d.id] = !S.open[d.id]; drawMenu(); break;
    case 'size': S.size[d.id] = d.size; drawMenu(); break;
    case 'add-cart': addToCart(d.id); break;
    case 'm-add': openItemDlg(null); break;
    case 'm-edit': openItemDlg(d.id); break;
    case 'm-del': openDelDlg(d.id); break;
    case 'o-type': S.cart.type = d.v; drawCart(); break;
    case 'o-pay': S.cart.pay = d.v; drawCart(); break;
    case 'qty': changeQty(d.line,Number(d.d)); break;
    case 'o-clear-cart': S.cart.lines = []; drawCart(); break;
    case 'process': processOrder(); break;
    case 'disc-pick': { var di = $('#disc'); if(di){ di.value = d.v; di.focus(); } break; }
    case 'pw-toggle': {
      var pi = $('#pass'), show = pi.type==='password';
      pi.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show';
      b.setAttribute('aria-pressed',String(show)); b.setAttribute('aria-label',show?'Hide password':'Show password'); pi.focus(); break;
    }
    case 'forgot': { var fn = $('#forgotNote'); fn.hidden = !fn.hidden; b.setAttribute('aria-expanded',String(!fn.hidden)); break; }
    case 'u-list': S.uv.mode='list'; S.uv.id=null; S.uv.del=false; render(); window.scrollTo(0,0); break;
    case 'u-history': S.uv.mode='profile'; S.uv.id=d.id; render(); window.scrollTo(0,0); break;
    case 'u-edit': S.uv.mode='edit'; S.uv.id=d.id; S.uv.del=false; render(); window.scrollTo(0,0); break;
    case 'u-new': S.uv.mode='new'; S.uv.id=null; S.uv.del=false; render(); window.scrollTo(0,0); break;
    case 'u-del': S.uv.del=true; render(); focusBtn('u-del-no'); break;
    case 'u-del-no': S.uv.del=false; render(); break;
    case 'u-del-yes': deleteUser(); break;
    case 'u-clear': S.uv.q=''; S.uv.role='all'; S.uv.status='all'; render(); break;
    case 'o-clear': S.om.oq=''; S.om.ostatus='active'; render(); break;
    case 'om-order': S.om.editOrder=d.id; render(); window.scrollTo(0,0); break;
    case 'om-cancel': S.om.editOrder=null; render(); break;
    case 'rp-export-yes': S.rp.exp='choose'; S.rp.step=4; render(); break;
    case 'rp-export-skip': S.rp.exp='skipped'; S.rp.step=4; render(); break;
    case 'rp-fmt': S.rp.exp=d.fmt; S.rp.step=4; render(); break;
    case 'rp-copy': copyCSV(); break;
    case 'rp-change': S.rp.step=1; S.rp.exp=null; render(); break;
    case 'rp-new': S.rp.step=1; S.rp.exp=null; S.rp.result=null; render(); window.scrollTo(0,0); break;
  }
});
function focusBtn(act){
  var btn = $('[data-act='+act+']');
  if(btn){ btn.focus(); if(btn.scrollIntoView) btn.scrollIntoView({block:'nearest'}); }
}
app.addEventListener('submit',function(e){
  e.preventDefault();
  var f = e.target;
  if(f.id==='loginForm') doLogin(f);
  else if(f.id==='userForm') saveUser(f);
  else if(f.id==='orderForm') saveOrder(f);
  else if(f.id==='discForm') saveDiscount(f);
  else if(f.id==='rpForm') generate(f);
});
app.addEventListener('input',function(e){
  var id = e.target.id;
  if(id==='gq'){
    S.q = e.target.value;
    if(S.view==='menu') drawMenu();
    else { S.view = 'menu'; try{ location.hash = 'menu'; }catch(x){} render(); var g = $('#gq'); if(g){ g.focus(); g.setSelectionRange(g.value.length,g.value.length); } }
  }
  else if(id==='uq'){ S.uv.q = e.target.value; drawUsers(); }
  else if(id==='oq'){ S.om.oq = e.target.value; drawOrders(); }
  else if(id==='user' || id==='pass'){ clearLoginErr(); }
});
app.addEventListener('change',function(e){
  var t = e.target;
  if(t.id==='urole'){ S.uv.role = t.value; drawUsers(); }
  else if(t.id==='ustatus'){ S.uv.status = t.value; drawUsers(); }
  else if(t.id==='ostatus'){ S.om.ostatus = t.value; drawOrders(); }
  else if(t.name==='range' && t.form && t.form.id==='rpForm'){ S.rp.range = t.value; }
  else if(t.name==='type' && t.form && t.form.id==='rpForm'){ S.rp.type = t.value; }
});
function capsCheck(e){
  if(e.target.id!=='pass' || !e.getModifierState) return;
  var n = $('#capsNote'); if(n) n.hidden = !e.getModifierState('CapsLock');
}
app.addEventListener('keydown',capsCheck);
app.addEventListener('keyup',capsCheck);
app.addEventListener('focusout',function(e){ if(e.target.id==='pass'){ var n = $('#capsNote'); if(n) n.hidden = true; } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeBell(); });

var dlg = $('#dlg');
dlg.addEventListener('click',function(e){
  if(e.target===dlg){ dlg.close(); return; }
  var b = e.target.closest('[data-dact]'); if(!b) return;
  if(b.dataset.dact==='cancel') dlgClose();
  else if(b.dataset.dact==='del-yes') deleteItem();
});
dlg.addEventListener('submit',function(e){ e.preventDefault(); if(e.target.id==='itemForm') saveItem(e.target); });
dlg.addEventListener('close',function(){ dlg.innerHTML = ''; S.dlgFor = null; });

window.addEventListener('hashchange',function(){
  var v = hashView();
  if(S.authed && v && v!==S.view){ S.view = v; render(); }
});

S.view = hashView() || 'menu';
render();
})();

</script>
</body></html>
